model:
  audio_encoder: 
    model_path: "path/to/audio_encoder/model"
    input_shape: [1, 16000]  
    embedding_dim: 256

  text_encoder: 
    model_path: "path/to/text_encoder/model"
    vocab_size: 10000
    embedding_dim: 256

joint_embedding:
  latent_space_dim: 512

training:
  batch_size: 32
  learning_rate: 0.001
  num_epochs: 50
  optimizer: "adam"

data:
  dataset_path: "path/to/dataset"
  audio_format: "wav"
  text_format: "txt"

retrieval:
  similarity_threshold: 0.7

logging:
  log_dir: "path/to/logs"
  log_level: "INFO"