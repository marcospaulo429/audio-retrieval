[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clap_audio_knn"
version = "0.1.0"
description = "Um classificador de áudio k-NN usando embeddings do modelo CLAP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Seu Nome", email = "seu@email.com" } # Sinta-se à vontade para alterar
]

# --- Estas são as dependências do seu projeto ---
# Elas foram tiradas do seu script 'testar_clap.py'
dependencies = [
    "torch",          # Para rodar o modelo de IA
    "msclap",         # O modelo CLAP que você sugeriu
    "datasets",       # Para baixar o ESC-50
    "scikit-learn",   # Para o k-NN e as métricas
    "tqdm",           # Para as barras de progresso
    "numpy"           # Para manipulação de arrays (usado no script)
]